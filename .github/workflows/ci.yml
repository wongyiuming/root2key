name: rust-dev-ci

on:
  push:
    branches: [rust-dev]
  pull_request:
    branches: [rust-main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bootstrap.rs')
          s = p.read_text()
          s = s.replace('            r#"set -eu\n', '            r##"set -eu\n', 1)
          s = s.replace('\n"#,\n            shell_quote(&self.sshd),', '\n"##,\n            shell_quote(&self.sshd),', 1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- src/bootstrap.rs; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/bootstrap.rs
            git commit -m "fix(rust): repair embedded sshd migration script"
            git push origin HEAD:rust-dev
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libssh2-1-dev
      - name: Check
        run: cargo check
      - name: Build container
        run: docker build -t root2key:rust-dev .
