[package]
name = "root2key"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
base64 = "0.22"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom"] }
ssh2 = "0.9.6"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net"] }
